version: 2

# Gold layer: descriptions, tests and constraints for all 8 tables.
#   description  -> written to Unity Catalog by persist_docs   (was comments.sql)
#   data_tests   -> run by dbt build after each table           (was 09_gold_bridge_table_quality_checks)
#   post_hook    -> informational PK / FK, macros/constraints.sql (was 99_gold_constraints.sql)

models:

  # ---------------------------------------------------------------- dimensions
  - name: dim_date
    description: >-
      Calendar dimension, one row per day from 2020-01-01 to 2030-12-31.
      Used to slice fct_events by year/quarter/month.
    config:
      post_hook:
        - "{{ drop_primary_key() }}"
        - "{{ set_not_null('date') }}"
        - "{{ add_primary_key('pk_dim_date', ['date']) }}"
    columns:
      - name: date
        description: "Calendar date. Primary key; joins to fct_events.event_date."
        data_tests: [unique, not_null]
      - name: year
        description: "Calendar year extracted from date."
      - name: quarter
        description: "Calendar quarter (1-4) extracted from date."
      - name: month
        description: "Calendar month (1-12) extracted from date."
      - name: year_month
        description: "Year and month formatted as yyyy-MM, e.g. 2026-10."
      - name: year_quarter
        description: "Year and quarter formatted as yyyy-Qn, e.g. 2026-Q4."

  - name: dim_source
    description: >-
      Dimension: one row per source document (news article, press release, or
      filing) ingested into the pipeline, enriched with its AI-generated
      summary and event count.
    config:
      post_hook:
        - "{{ drop_primary_key() }}"
        - "{{ set_not_null('doc_id') }}"
        - "{{ add_primary_key('pk_dim_source', ['doc_id']) }}"
    columns:
      - name: doc_id
        description: "Primary key. Unique identifier of a source document."
        data_tests: [unique, not_null]
      - name: title
        description: "Document title/headline, translated to English via ai_translate when the original language was zh."
      - name: publisher
        description: "Name of the publishing outlet or organization."
      - name: source_type
        description: "Type of source document. One of: press_release, filing, news, policy."
        data_tests:
          - accepted_values:
              arguments:
                values: ['press_release', 'filing', 'news', 'policy']
      - name: language
        description: "Original language of the document before translation. One of: en, zh."
        data_tests:
          - accepted_values:
              arguments:
                values: ['en', 'zh']
      - name: publish_date
        description: >-
          Date the document was published. Used to resolve relative dates during
          AI extraction and as the fallback for fct_events.event_date when no
          explicit event date is stated. This is an actual DATE value -- do not
          confuse with the boolean column of the same name on fct_events.
      - name: url
        description: "Source URL of the document, when available."
      - name: primary_company
        description: "Company the document is primarily about, as identified in the ingestion manifest."
      - name: summary_en
        description: "2-3 sentence English-language summary of the document, generated by the ai_query extraction step."
      - name: event_count
        description: >-
          Number of events the AI extraction step found in this document
          (0 if none, or if the document has not been processed yet).
        data_tests: [not_null]

  - name: dim_company
    description: >-
      Dimension: one row per company referenced anywhere in the extracted event
      data (manufacturers, suppliers, investors, customers, partners).
    config:
      post_hook:
        - "{{ drop_primary_key() }}"
        - "{{ set_not_null('company_id') }}"
        - "{{ add_primary_key('pk_dim_company', ['company_id']) }}"
    columns:
      - name: company_id
        description: "Primary key. Unique identifier for a company."
        data_tests: [unique, not_null]
      - name: company_name
        description: "Standard English company name."
        data_tests: [not_null]
      - name: company_name_zh
        description: "Company name in Chinese, when available."
      - name: company_type
        description: >-
          Role this company typically plays in the humanoid robotics industry.
          One of: humanoid_maker, tier1, investor, customer, technology_partner, other.
        data_tests:
          - accepted_values:
              arguments:
                values: ['humanoid_maker', 'tier1', 'investor', 'customer', 'technology_partner', 'other']
      - name: country
        description: "Country where the company is headquartered."
      - name: region
        description: >-
          Region where the company is headquartered. Distinct from
          fct_events.region, which is where a specific event took place.

  - name: dim_technology
    description: >-
      Dimension: static lookup of the 6 technology areas used to tag events
      (sensors, compute & electronics, software & AI, actuators, battery & power,
      not specified). Not derived from source data.
    config:
      post_hook:
        - "{{ drop_primary_key() }}"
        - "{{ set_not_null('technology_id') }}"
        - "{{ add_primary_key('pk_dim_technology', ['technology_id']) }}"
    columns:
      - name: technology_id
        description: "Primary key. Stable slug for a technology area, e.g. sensors, compute_electronics."
        data_tests: [unique, not_null]
      - name: technology_name
        description: "Human-readable display name of the technology area."
      - name: sort_order
        description: "Suggested display order for reporting/UI (1-6)."
      - name: description
        description: "One-sentence definition of what this technology area covers."

  # ---------------------------------------------------------------- fact
  - name: fct_events
    description: >-
      Fact table: one row per de-duplicated humanoid-robotics industry event
      (funding, partnership, product launch, production plan, or policy
      announcement) extracted by AI from news/press-release text. Grain: one
      event. Event de-duplication is currently a placeholder 1:1 mapping -- see
      source_count.
    config:
      post_hook:
        - "{{ drop_primary_key() }}"
        - "{{ set_not_null('event_id') }}"
        - "{{ add_primary_key('pk_fct_events', ['event_id']) }}"
        - "{{ drop_constraint('fk_fct_events_date') }}"
        - "{{ add_foreign_key('fk_fct_events_date', 'event_date', ref('dim_date'), 'date') }}"
        - "{{ drop_constraint('fk_fct_events_primary_source') }}"
        - "{{ add_foreign_key('fk_fct_events_primary_source', 'primary_source_doc_id', ref('dim_source'), 'doc_id') }}"
    columns:
      - name: event_id
        description: >-
          Primary key. Surrogate key for a de-duplicated event, derived from the
          doc_id and position of the extraction that produced the canonical record.
        data_tests: [unique, not_null]
      - name: event_type
        description: "Category of the event. One of: funding, partnership, product_launch, production_plan, policy, other."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['funding', 'partnership', 'product_launch', 'production_plan', 'policy', 'other']
      - name: event_date
        description: >-
          Date the event occurred, as stated or inferred by the AI extraction
          model. Falls back to the source document publish date when no explicit
          event date is stated in the text. Foreign key to dim_date.date.
        data_tests:
          # warn: dim_date only covers 2020-2030; an older event date is reported, not fatal
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date
              config:
                severity: warn
      - name: date_is_publish_date
        description: >-
          True when event_date above was filled in from the source document
          publish date because the text states no explicit event date; such
          dates are approximate (the event may have happened earlier). False when
          event_date was stated in the text. The document publish date itself is
          dim_source.publish_date.
      - name: amount
        description: >-
          Monetary amount associated with the event (e.g. funding round size),
          denominated in currency. Null if no amount was stated or not applicable
          to this event_type.
      - name: currency
        description: "ISO 4217 currency code for amount, e.g. USD, CNY. Null when amount is null."
      - name: region
        description: >-
          Region where the event took place -- not necessarily where the involved
          companies are headquartered. One of: Europe, North America, China,
          Asia_other, Global, not_specified.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Europe', 'North America', 'China', 'Asia_other', 'Global', 'not_specified']
      - name: evidence_quote
        description: >-
          One sentence copied verbatim from the source article by the AI
          extraction model, as evidence supporting this event.
      - name: primary_source_doc_id
        description: >-
          doc_id of the document used as the canonical/primary source for this
          event after de-duplication. Foreign key to dim_source.doc_id. See
          bridge_event_source for every document that reported this event.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_source')
                field: doc_id
      - name: source_count
        description: >-
          Number of source documents that reported this event, post-dedup.
          Currently always 1 because event de-duplication
          (silver.event_dedup_map) is a placeholder 1:1 mapping -- see README
          Known Limitations.

  # ---------------------------------------------------------------- bridges
  - name: bridge_event_company
    description: >-
      Bridge table: many-to-many link between fct_events and dim_company,
      carrying the company's role in each event. A company can appear in the
      same event with more than one role.
    config:
      post_hook:
        - "{{ drop_primary_key() }}"
        - "{{ set_not_null('event_id') }}"
        - "{{ set_not_null('company_id') }}"
        - "{{ set_not_null('role') }}"
        - "{{ add_primary_key('pk_bridge_event_company', ['event_id', 'company_id', 'role']) }}"
        - "{{ drop_constraint('fk_bec_event') }}"
        - "{{ add_foreign_key('fk_bec_event', 'event_id', ref('fct_events'), 'event_id') }}"
        - "{{ drop_constraint('fk_bec_company') }}"
        - "{{ add_foreign_key('fk_bec_company', 'company_id', ref('dim_company'), 'company_id') }}"
    data_tests:
      - unique_key_combination:
          arguments:
            columns: ['event_id', 'company_id', 'role']
    columns:
      - name: event_id
        description: "Foreign key to fct_events.event_id."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_events')
                field: event_id
      - name: company_id
        description: "Foreign key to dim_company.company_id."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_id
      - name: role
        description: "Role this company played in this specific event. One of: investor, target, partner, customer, supplier, issuer."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['investor', 'target', 'partner', 'customer', 'supplier', 'issuer']

  - name: bridge_event_technology
    description: >-
      Bridge table: many-to-many link between fct_events and dim_technology --
      one event can relate to multiple technology areas.
    config:
      post_hook:
        - "{{ drop_primary_key() }}"
        - "{{ set_not_null('event_id') }}"
        - "{{ set_not_null('technology_id') }}"
        - "{{ add_primary_key('pk_bridge_event_technology', ['event_id', 'technology_id']) }}"
        - "{{ drop_constraint('fk_bet_event') }}"
        - "{{ add_foreign_key('fk_bet_event', 'event_id', ref('fct_events'), 'event_id') }}"
        - "{{ drop_constraint('fk_bet_technology') }}"
        - "{{ add_foreign_key('fk_bet_technology', 'technology_id', ref('dim_technology'), 'technology_id') }}"
    data_tests:
      - unique_key_combination:
          arguments:
            columns: ['event_id', 'technology_id']
    columns:
      - name: event_id
        description: "Foreign key to fct_events.event_id."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_events')
                field: event_id
      - name: technology_id
        description: "Foreign key to dim_technology.technology_id."
        data_tests:
          # also catches technology values from the AI that are not in the lookup
          - not_null
          - relationships:
              arguments:
                to: ref('dim_technology')
                field: technology_id

  - name: bridge_event_source
    description: >-
      Bridge table: many-to-many link between fct_events and dim_source -- every
      document that reported a given event (not only the primary source), with
      a flag marking the primary one.
    config:
      post_hook:
        - "{{ drop_primary_key() }}"
        - "{{ set_not_null('event_id') }}"
        - "{{ set_not_null('doc_id') }}"
        - "{{ add_primary_key('pk_bridge_event_source', ['event_id', 'doc_id']) }}"
        - "{{ drop_constraint('fk_bes_event') }}"
        - "{{ add_foreign_key('fk_bes_event', 'event_id', ref('fct_events'), 'event_id') }}"
        - "{{ drop_constraint('fk_bes_source') }}"
        - "{{ add_foreign_key('fk_bes_source', 'doc_id', ref('dim_source'), 'doc_id') }}"
    data_tests:
      - unique_key_combination:
          arguments:
            columns: ['event_id', 'doc_id']
    columns:
      - name: event_id
        description: "Foreign key to fct_events.event_id."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_events')
                field: event_id
      - name: doc_id
        description: "Foreign key to dim_source.doc_id."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_source')
                field: doc_id
      - name: is_primary_source
        description: >-
          True when this doc_id is the canonical/primary source recorded on
          fct_events.primary_source_doc_id for this event_id.
