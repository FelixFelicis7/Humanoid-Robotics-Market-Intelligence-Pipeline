resources:
  jobs:
    humanoid_robotics_dwh_pipeline:
      name: humanoid robotics dwh pipeline (bundle)
      description: "End-to-end pipeline: bronze → silver (translation) → dbt
        (silver AI extraction + gold star schema + tests) → metric views + RAG
        vector index. Run after uploading new documents."
      email_notifications:
        on_failure:
          - ${var.notify_email}
        on_duration_warning_threshold_exceeded:
          - ${var.notify_email}
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 900
      environments:
        - environment_key: dbt_env
          spec:
            environment_version: "5"
            dependencies:
              - dbt-databricks>=1.8.0,<2.0.0
      tasks:
        - task_key: bronze_company_info
          notebook_task:
            notebook_path: ../scripts/bronze/bronze_company_info.ipynb
            source: WORKSPACE
          max_retries: 1
          min_retry_interval_millis: 60000
          disable_auto_optimization: false
        - task_key: bronze_documents
          notebook_task:
            notebook_path: ../scripts/bronze/bronze_documents.ipynb
            source: WORKSPACE
          max_retries: 1
          min_retry_interval_millis: 60000
          disable_auto_optimization: false
        - task_key: bronze_manifest
          notebook_task:
            notebook_path: ../scripts/bronze/bronze_manifest.ipynb
            source: WORKSPACE
          max_retries: 1
          min_retry_interval_millis: 60000
          disable_auto_optimization: false
        - task_key: silver_01_companies
          depends_on:
            - task_key: bronze_company_info
          notebook_task:
            notebook_path: ../scripts/silver/01_silver_companies.ipynb
            source: WORKSPACE
          max_retries: 1
          min_retry_interval_millis: 60000
          disable_auto_optimization: false
        - task_key: silver_02_company_alias
          depends_on:
            - task_key: bronze_company_info
          notebook_task:
            notebook_path: ../scripts/silver/02_silver_company_alias.ipynb
            source: WORKSPACE
          max_retries: 1
          min_retry_interval_millis: 60000
          disable_auto_optimization: false
        - task_key: silver_03a_document_translations
          depends_on:
            - task_key: bronze_manifest
            - task_key: bronze_documents
          sql_task:
            file:
              path: ../scripts/silver/sql/03a_silver_document_translations.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: silver_03_documents
          depends_on:
            - task_key: silver_03a_document_translations
          notebook_task:
            notebook_path: ../scripts/silver/03_silver_documents.ipynb
            source: WORKSPACE
          max_retries: 1
          min_retry_interval_millis: 60000
          disable_auto_optimization: false
        - task_key: dbt_build
          depends_on:
            - task_key: silver_03_documents
            - task_key: silver_01_companies
            - task_key: silver_02_company_alias
          environment_key: dbt_env
          max_retries: 0
          timeout_seconds: 2700
          disable_auto_optimization: true
          dbt_task:
            project_directory: ../dbt
            profiles_directory: dbt_profiles/
            commands:
              - "dbt deps --target=${bundle.target}"
              - "dbt build --target=${bundle.target}"
        - task_key: gold_metric_views
          depends_on:
            - task_key: dbt_build
          sql_task:
            file:
              path: ../scripts/gold/sql/metric_views.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
          max_retries: 1
          min_retry_interval_millis: 60000
        - task_key: silver_13_doc_chunks
          depends_on:
            - task_key: dbt_build
          notebook_task:
            notebook_path: ../scripts/silver/13_silver_doc_chunks.ipynb
            source: WORKSPACE
          max_retries: 1
          min_retry_interval_millis: 60000
          disable_auto_optimization: false
        - task_key: rag_01_vector_index
          depends_on:
            - task_key: silver_13_doc_chunks
          notebook_task:
            notebook_path: ../scripts/rag/01_vector_index.ipynb
            source: WORKSPACE
          max_retries: 1
          min_retry_interval_millis: 60000
          disable_auto_optimization: false
      tags:
        env: ${bundle.target}
        project: humanoid-market-intel
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED